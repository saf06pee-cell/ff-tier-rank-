<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF TIER RANK</title>
<style>
:root {
  --gold: #ffcc33;
  --bg: #05070b;
  --panel: #0d111a;
  --border: #66501a;
  --white: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Tahoma, sans-serif;
}
header {
  padding: 18px;
  background: #080a0f;
  border-bottom: 2px solid var(--gold);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.logo {
  color: var(--gold);
  font-size: 25px;
  font-weight: 900;
  font-style: italic;
}
nav { display: flex; gap: 16px; flex-wrap: wrap; }
nav a { color: white; text-decoration: none; }
nav a:hover { color: var(--gold); }
button {
  cursor: pointer;
  padding: 10px 15px;
  border: 1px solid var(--gold);
  border-radius: 6px;
  background: #15130b;
  color: var(--gold);
}
